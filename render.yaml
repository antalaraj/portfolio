services:
  - type: web
    name: raj-portfolio-backend
    env: python
    region: oregon
    plan: starter
    buildCommand: |
      pip install --upgrade pip
      pip install -r backend/requirements.txt
      python backend/manage.py collectstatic --noinput
      python backend/manage.py migrate
    startCommand: gunicorn --chdir backend config.wsgi:application --bind 0.0.0.0:$PORT --workers 3
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.0
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: portfolio-postgres
          property: connectionString
      - key: DJANGO_ALLOWED_HOSTS
        value: .onrender.com,rajantala.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://rajantala.com,https://portfolio-frontend.vercel.app
      - key: CSRF_TRUSTED_ORIGINS
        value: https://rajantala.com,https://portfolio-frontend.vercel.app
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false

databases:
  - name: portfolio-postgres
    region: oregon
    plan: free
